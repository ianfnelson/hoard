name: Server build, test, publish

on:
  push:
    branches: [ "main" ]
    paths:
      - 'src/server/**'
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAMESPACE: ${{ github.repository_owner }}/hoard
  BUILD_CONFIGURATION: Release

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/server
    steps:
      - uses: actions/checkout@v6

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Add GitHub Packages credentials
        run: dotnet nuget update source github --username ianfnelson --password ${{ secrets.GITHUB_TOKEN }} --store-password-in-clear-text

      - name: Restore solution
        run: dotnet restore Hoard.sln

      - name: Build
        run: dotnet build Hoard.sln -c ${{ env.BUILD_CONFIGURATION }} --no-restore

      - name: Test
        run: dotnet test Hoard.sln -c ${{ env.BUILD_CONFIGURATION }} --no-build --verbosity normal

  publish:
    needs: test
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v6

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Add GitHub Packages credentials
        run: dotnet nuget update source github --username ianfnelson --password ${{ secrets.GITHUB_TOKEN }} --store-password-in-clear-text

      - name: Build and push API image
        uses: docker/build-push-action@v7
        with:
          context: src/server
          file: src/server/Hoard.Api/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}-api:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}-api:${{ github.sha }}
          secrets: |
            "nuget_auth_token=${{ secrets.GITHUB_TOKEN }}"
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push Bus image
        uses: docker/build-push-action@v7
        with:
          context: src/server
          file: src/server/Hoard.Bus/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}-bus:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}-bus:${{ github.sha }}
          secrets: |
            "nuget_auth_token=${{ secrets.GITHUB_TOKEN }}"
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push Scheduler image
        uses: docker/build-push-action@v7
        with:
          context: src/server
          file: src/server/Hoard.Scheduler/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}-scheduler:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}-scheduler:${{ github.sha }}
          secrets: |
            "nuget_auth_token=${{ secrets.GITHUB_TOKEN }}"
          cache-from: type=gha
          cache-to: type=gha,mode=max
