name: Server build, test, publish

on:
  push:
    branches: [ "main" ]
    paths:
      - 'src/server/**'
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAMESPACE: ${{ github.repository_owner }}/hoard
  BUILD_CONFIGURATION: Release

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/server
    steps:
      - uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Restore solution
        run: dotnet restore Hoard.sln

      - name: Build
        run: dotnet build Hoard.sln -c ${{ env.BUILD_CONFIGURATION }} --no-restore

      - name: Test
        run: dotnet test Hoard.sln -c ${{ env.BUILD_CONFIGURATION }} --no-build --verbosity normal

  # Compiles the Clarion news adapter so a break surfaces before the image build.
  # Only this repo's token can read the private package, so forks and fork PRs rely on the default build in `test`.
  build-clarion:
    if: >-
      github.repository == 'ianfnelson/hoard' &&
      (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    env:
      UseClarion: 'true'
    defaults:
      run:
        working-directory: src/server
    steps:
      - uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Add GitHub Packages source
        run: dotnet nuget add source "https://nuget.pkg.github.com/ianfnelson/index.json" --name github --configfile NuGet.Config

      - name: Restore solution
        run: dotnet restore Hoard.sln
        env:
          NuGetPackageSourceCredentials_github: Username=ianfnelson;Password=${{ secrets.GITHUB_TOKEN }}

      - name: Build
        run: dotnet build Hoard.sln -c ${{ env.BUILD_CONFIGURATION }} --no-restore

  publish:
    needs: [test, build-clarion]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push API image
        uses: docker/build-push-action@v7
        with:
          context: src/server
          file: src/server/Hoard.Api/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}-api:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}-api:${{ github.sha }}
          secrets: |
            "nuget_auth_token=${{ secrets.GITHUB_TOKEN }}"
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push Bus image
        uses: docker/build-push-action@v7
        with:
          context: src/server
          file: src/server/Hoard.Bus/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}-bus:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}-bus:${{ github.sha }}
          secrets: |
            "nuget_auth_token=${{ secrets.GITHUB_TOKEN }}"
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push Scheduler image
        uses: docker/build-push-action@v7
        with:
          context: src/server
          file: src/server/Hoard.Scheduler/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}-scheduler:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}-scheduler:${{ github.sha }}
          secrets: |
            "nuget_auth_token=${{ secrets.GITHUB_TOKEN }}"
          cache-from: type=gha
          cache-to: type=gha,mode=max
